name: Initialize
description: Check out Dart Sass and build the embedded protocol buffer.
inputs:
  github-token: {required: true}
  node-version: {required: false, default: 'lts/*'}
  dart-sdk: {required: false, default: stable}
  architecture: {required: false}
  for-npm-deploy: {required: false, default: false}
runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      with:
        sdk: "${{ inputs.dart-sdk }}"
        architecture: "${{ inputs.architecture }}"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: "inputs.for-npm-deploy != true"
      with:
        node-version: "${{ inputs.node-version }}"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.for-npm-deploy == true
      with:
        node-version: "${{ inputs.node-version }}"
        check-latest: true
        registry-url: 'https://registry.npmjs.org'

    # npm trusted publisher infrastructure requires npm >=11.5.1
    - run: npm install -g npm@latest # zizmor: ignore[adhoc-packages]
      if: inputs.for-npm-deploy == true
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}

    # See: https://github.com/dart-lang/sdk/issues/52266
    - run: Invoke-WebRequest https://pub.dev
      if: runner.os == 'Windows'
      shell: pwsh

    # See: https://github.com/orgs/community/discussions/131594
    # The composite action requires an explict shell, but bash is not available on windows-arm64 runner.
    # For the following commands conditionally use bash or pwsh based on the runner.os:
    - run: dart pub get
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}

    - run: npm install
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}

    - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
      with:
        setup_only: true

    # This composite action requires bash, but bash is not available on
    # windows-arm64 runner. In practice, we only use the windows-arm64 runner
    # for releases, so it doesn't need to link repository versions.
    - name: Check out the language repo
      if: runner.os != 'windows' || runner.arch != 'ARM64'
      uses: sass/clone-linked-repo@ec2dcd11c5eaec56b64855712372056a14e9614d # v1.0.0
      with: {repo: sass/sass, path: build/language}
    - name: Check out the language repo
      if: runner.os == 'windows' && runner.arch == 'ARM64'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sass/sass
        path: build/language
        persist-credentials: false

    - name: Generate Dart from protobuf
      run: dart run grinder protobuf
      env: {UPDATE_SASS_SASS_REPO: false}
      shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
